# Junta los archivos nuevos con los que ya están en la rama "data", la reemplaza
# (sin historial, para que el repo no crezca) y publica todo en GitHub Pages.
name: Publicar datos
inputs:
  token:
    required: true
runs:
  using: composite
  steps:
    - name: Juntar con la rama data
      shell: bash
      run: |
        mkdir -p site
        if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
          git fetch -q --depth 1 origin data
          git --work-tree=site checkout FETCH_HEAD -- .
        fi
        cp -r new/. site/
        cd site && rm -rf .git && touch .nojekyll
        git init -q -b data
        git config user.name "celaje-bot"
        git config user.email "actions@users.noreply.github.com"
        git add -A && git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
        git push -q -f "https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git" data
        rm -rf .git
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - uses: actions/deploy-pages@v4
