# Publica en GitHub Pages lo que haya en la rama "data". La lanzan las otras tareas cada
# vez que guardan algo; si llegan varias juntas, gana la última (todas publican lo mismo).
name: Publicar

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          path: site
      - run: rm -rf site/.git && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
