# Cada 3 horas: baja el último pronóstico del ECMWF, genera rain.bin y lo publica
# en GitHub Pages (https://<usuario>.github.io/celaje-datos/rain.bin).
name: Mapa de lluvia

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ecmwf-opendata eccodes numpy
      # Copia del ECMWF en la nube de Amazon: más rápida y sin el límite de conexiones del portal.
      - run: python build.py
        env:
          ECMWF_SOURCE: aws
      - name: Publicar en la rama gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "celaje-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Mapa de lluvia $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      # GitHub apaga las tareas programadas tras 60 días sin actividad: volver a activarla la mantiene viva.
      - name: Mantener activa la tarea
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
