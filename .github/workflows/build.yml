# Mapa de lluvia (ECMWF) → rain.bin. La lanza la tarea de rayos cuando el mapa tiene más de
# 3 horas (y el reloj de GitHub, cuando funciona).
name: Mapa de lluvia

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lluvia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ecmwf-opendata eccodes numpy
      # Copia del ECMWF en la nube de Microsoft (la de Amazon frenaba con "503 Slow Down").
      - run: python build.py
        env:
          ECMWF_SOURCE: azure
      - name: Guardar y publicar
        run: |
          mkdir -p new && cp out/rain.bin new/ && (cp out/wind.bin new/ || true)
          scripts/push_data.sh new lluvia
          gh workflow run publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
