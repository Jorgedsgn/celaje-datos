# Cada 3 horas: mapa de lluvia (ECMWF) → rain.bin.
name: Mapa de lluvia

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ecmwf-opendata eccodes numpy
      # Copia del ECMWF en la nube de Microsoft (la de Amazon frenaba con "503 Slow Down").
      - run: python build.py
        env:
          ECMWF_SOURCE: azure
      - uses: actions/upload-artifact@v4
        with:
          name: rain
          path: out/rain.bin
      # GitHub apaga las tareas programadas tras 60 días sin actividad: volver a activarla la mantiene viva.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rain
          path: new
      - uses: ./.github/actions/publish
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
