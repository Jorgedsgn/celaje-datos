# Pronóstico por hora de Chile con ECMWF, GFS e ICON → fc/*.bin. La lanza la tarea de rayos
# cuando tiene más de 6 horas (y el reloj de GitHub, cuando funciona).
name: Pronóstico

on:
  schedule:
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pronostico
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ecmwf-opendata eccodes numpy scipy
      - run: python forecast.py
        env:
          ECMWF_SOURCE: azure
      - name: Guardar y publicar
        run: |
          mkdir -p new && cp -r out/fc new/
          scripts/push_data.sh new pronostico
          gh workflow run publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
