# Rayos de la última hora, cada 5 minutos, en una tarea encadenada: corre ~55 minutos y al
# final lanza la siguiente (no depende del reloj de GitHub, que se salta tareas frecuentes).
# De paso revisa que la lluvia y el pronóstico estén al día y, si no, los lanza.
name: Rayos

on:
  schedule:
    - cron: "*/30 * * * *"      # respaldo, por si la cadena se corta
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rayos
  cancel-in-progress: false

jobs:
  lightning:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install h5py numpy
      - name: Rayos cada 5 minutos durante ~55 minutos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git fetch -q --depth 1 origin data && git show FETCH_HEAD:lightning.json > prev.json 2>/dev/null || echo '{}' > prev.json
          end=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            if PREVIOUS_FILE=prev.json python lightning.py; then
              cp out/lightning.json prev.json
              mkdir -p new && cp out/lightning.json new/ && cp -r out/lt new/
              scripts/push_data.sh new rayos || true   # la app lee la rama data directo; Pages no se republica cada 5 min
            fi
            # ¿Lluvia (3 h) o pronóstico (6 h) viejos? Se lanzan si no están corriendo ya.
            git fetch -q --depth 1 origin data && git show FETCH_HEAD:stamps.json > stamps.json 2>/dev/null || echo '{}' > stamps.json
            python3 scripts/stale.py > lanzar.txt
            for wf in $(cat lanzar.txt); do
              busy=$(gh run list --workflow "$wf" --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
              [ "$busy" = "0" ] && gh workflow run "$wf" && echo "Lanzado $wf"
            done
            sleep $(( 300 - ($(date +%s) - t0) > 0 ? 300 - ($(date +%s) - t0) : 1 ))
          done
      - name: Lanzar la siguiente vuelta
        if: always()
        run: gh workflow run lightning.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
